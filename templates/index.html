<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Personal Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <h1 class="main-heading">AI Personal Assistant</h1>

    <div class="container">

        <h2>Ask Anything</h2>
        <form id="askForm">
            <input type="text" name="question" placeholder="Ask anything..." required>
            <button type="submit">Ask</button>
        </form>
        <p id="ans-loading" style="display: none;">Processing...</p>
        <div id="answer"></div>

        <hr>

        <h2>Summarize Email</h2>
        <form id="emailForm">
            <textarea type="text" name="email" placeholder="Paste your email here.." required></textarea>
            <button type="submit">Summarize</button>
        </form>
        <p id="summary-loading" style="display: none;">Processing...</p>
        <div id="summary"></div>

    </div>

<script>
    function displayResponse(element, text) {
        if (!text) {
            element.innerText = "No response received.";
            return;
        }
        if (window.marked && typeof window.marked.parse === "function") {
            element.innerHTML = window.marked.parse(text);
        } else {
            // Fallback: strip raw markdown marks if parser unavailable
            const cleaned = text
                .replace(/^#+\s+/gm, '')
                .replace(/\*\*(.*?)\*\*/g, '$1')
                .replace(/\*(.*?)\*/g, '$1')
                .replace(/\|/g, ' ')
                .replace(/-{3,}/g, '');
            element.innerText = cleaned;
        }
    }

    document.getElementById("askForm").onsubmit = async (e) => {
        e.preventDefault();
        const loading = document.getElementById("ans-loading");
        const answerEl = document.getElementById("answer");
        loading.style.display = "block";
        answerEl.innerHTML = "";

        try {
            let res = await fetch("/ask", {
                method: "POST",
                body: new FormData(e.target)
            });
            let data = await res.json();
            displayResponse(answerEl, data.response);
        } catch (err) {
            answerEl.innerText = "Error: " + err.message;
        } finally {
            loading.style.display = "none";
        }
    };

    document.getElementById("emailForm").onsubmit = async (e) => {
        e.preventDefault();
        const loading = document.getElementById("summary-loading");
        const summaryEl = document.getElementById("summary");
        loading.style.display = "block";
        summaryEl.innerHTML = "";

        try {
            let res = await fetch("/summarize", {
                method: "POST",
                body: new FormData(e.target)
            });
            let data = await res.json();
            displayResponse(summaryEl, data.response);
        } catch (err) {
            summaryEl.innerText = "Error: " + err.message;
        } finally {
            loading.style.display = "none";
        }
    };
</script>

</body>
</html>
